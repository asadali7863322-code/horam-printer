<!DOCTYPE html>
<html>

<head>

<title>
Gallery - {{ settings.website_name }}
</title>


<style>

body{

    margin:0;
    background:#111;
    color:white;
    font-family:Arial;

}


h1{

    text-align:center;
    color:gold;
    padding:30px;

}



.gallery{

    display:grid;

    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));

    gap:25px;

    padding:40px;

}



.card{

    background:#222;

    border:2px solid gold;

    padding:15px;

    border-radius:15px;

    text-align:center;

    transition:0.4s;

}



.card:hover{

    transform:scale(1.05);

}



.card img{

    width:100%;

    height:250px;

    object-fit:cover;

    border-radius:10px;

}



.card h3{

    color:gold;

}



</style>


</head>


<body>


<h1>
Our Latest Work
</h1>



<div class="gallery">


{% for image in images %}


<div class="card">


<img src="/uploads/{{ image[2] }}">


<h3>
{{ image[1] }}
</h3>


</div>


{% endfor %}


</div>



</body>

</html>
