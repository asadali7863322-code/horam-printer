<!DOCTYPE html>
<html>

<head>

<title>Place Order</title>

<style>

body{

background:#111;
color:white;
font-family:Arial;
padding:40px;

}

.container{

max-width:700px;
margin:auto;

}

input,
select,
textarea{

width:100%;
padding:15px;
margin:12px 0;
border:none;
border-radius:8px;

}

button{

background:gold;
color:black;
padding:15px 30px;
border:none;
border-radius:8px;
font-size:18px;
cursor:pointer;

}

button:hover{

background:white;

}

.success{

background:green;
padding:15px;
margin-bottom:20px;
border-radius:8px;

}

</style>

</head>

<body>

<div class="container">

<h1>

Place Your Order

</h1>

{% if success %}

<div class="success">

✅ Your Order has been Submitted Successfully.

</div>

{% endif %}

<form method="POST">

<input
type="text"
name="customer_name"
placeholder="Customer Name"
required>

<input
type="text"
name="phone"
placeholder="Phone Number"
required>

<select name="product">

<option>Lifafa Printing</option>

<option>Shopping Bags</option>

<option>Flex Printing</option>

<option>Doctor Files</option>

<option>Box Printing</option>

<option>Stickers</option>

<option>Visiting Cards</option>

</select>

<input
type="text"
name="quantity"
placeholder="Quantity">

<textarea
name="message"
placeholder="Order Details"
rows="6"></textarea>

<button>

Submit Order

</button>

</form>

</div>

</body>

</html>
